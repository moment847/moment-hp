<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サービスのご相談 | moment株式会社</title><meta name="description" content="momentのサービスに関するご相談をお寄せください。"><link rel="canonical" href="https://moment-tokyo.jp/contact"><link rel="icon" href="/moment-logo-v2.png"><link rel="stylesheet" href="/contact-form.css?v=20261009"></head><body><header><a href="/" aria-label="moment トップ"><img src="/moment-logo-v2.png" width="106" height="64" alt="moment"></a><a class="back" href="/#services">サービス一覧へ ↗</a></header>
<main><div class="intro"><p class="eyebrow">CONTACT</p><h1>次の一歩を<br>ここから</h1><p>取り組みたいことや、今感じている課題をお聞かせください。<br>具体的に決まっていない段階でも、お気軽にご相談ください。</p></div>
<form action="https://formsubmit.co/hello@moment-tokyo.jp" method="POST" id="inquiry-form">
<input type="hidden" name="_subject" value="【moment】サービスに関するお問い合わせ">
<input type="hidden" name="_next" value="https://moment-tokyo.jp/contact-thanks">
<input type="hidden" name="_template" value="table">
<div class="trap" aria-hidden="true"><label>この欄には入力しないでください<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label></div>
<div class="row"><label for="name">お名前 <span>必須</span></label><input id="name" name="お名前" autocomplete="name" required maxlength="100"></div>
<div class="row"><label for="company">会社名 <small>任意</small></label><input id="company" name="会社名" autocomplete="organization" maxlength="200"></div>
<div class="row"><label for="email">メールアドレス <span>必須</span></label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com"></div>
<div class="row"><label for="service">ご相談サービス <span>必須</span></label><select id="service" name="ご相談サービス" required><option value="">選択してください</option><option value="training">AI研修</option><option value="advisory">AI顧問</option><option value="ax-launch">AX Launch</option><option value="fde">FDE</option><option value="development">受託開発</option><option value="sales">営業支援</option><option value="marketing">デジタルマーケティング</option><option value="education">教育事業 Actify</option><option value="other">その他・まだ決まっていない</option></select></div>
<div class="row"><label for="message">ご相談内容 <span>必須</span></label><textarea id="message" name="ご相談内容" required maxlength="5000" rows="7" placeholder="現在の課題やご希望などをお聞かせください"></textarea></div>
<p class="note">入力内容はお問い合わせへの対応に使用します。送信にはFormSubmitを利用します。</p>
<label class="consent"><input type="checkbox" required name="個人情報の取扱いへの同意" value="同意する"><span><a href="/privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>と<a href="https://formsubmit.co/privacy.pdf" target="_blank" rel="noopener">送信サービスの個人情報の取扱い</a>を確認し、送信に同意する</span></label>
<button type="submit">この内容で送信する <span aria-hidden="true">↗</span></button><p class="note">送信時に迷惑メール防止のための確認画面が表示される場合があります。</p>
<p class="alternative">メールでのご相談：<a href="mailto:hello@moment-tokyo.jp">hello@moment-tokyo.jp</a></p>
</form></main><script src="/contact-form.js?v=20261009" defer></script><footer><span>© 2026 moment株式会社</span><a href="/privacy.html">プライバシーポリシー</a></footer></body></html>

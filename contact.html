</header><main id="main"><header class="page-heading "><div class="wrap">
    <p class="eyebrow" lang="en">Contact</p><h1>お問い合わせ</h1><p class="intro">事業のご相談、協業のご提案、採用についてのお問い合わせはこちらからお送りください。</p>
    </div></header><div class="narrow form-area"><form action="https://formsubmit.co/hello@moment-tokyo.jp" method="POST" id="inquiry-form">
<input type="hidden" name="_subject" value="【moment】お問い合わせ">
<input type="hidden" name="_next" value="https://moment-tokyo.jp/contact-thanks">
<input type="hidden" name="_template" value="table">
<div class="trap" aria-hidden="true"><label>この欄には入力しないでください<input type="text" name="_honey" tabindex="-1" autocomplete="off"></label></div>
<div class="row"><label for="name">お名前 <span>必須</span></label><input id="name" name="お名前" autocomplete="name" required maxlength="100"></div>
<div class="row"><label for="company">会社名 <small>任意</small></label><input id="company" name="会社名" autocomplete="organization" maxlength="200"></div>
<div class="row"><label for="email">メールアドレス <span>必須</span></label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com"></div>
<div class="row"><label for="service">ご相談の種類 <span>必須</span></label><select id="service" name="ご相談サービス" required><option value="">選択してください</option><option value="training">AI研修</option><option value="advisory">AI顧問</option><option value="fde">FDE</option><option value="development">受託開発</option><option value="sales">営業支援</option><option value="marketing">デジタルマーケティング</option><option value="education">教育事業 Actify</option><option value="recruit">採用・インターン</option><option value="other">その他・まだ決まっていない</option></select></div>
<div class="row"><label for="message">ご相談内容 <span>必須</span></label><textarea id="message" name="ご相談内容" required maxlength="5000" rows="7" placeholder="現在の課題やご希望などをお聞かせください"></textarea></div>
<p class="note">入力内容はお問い合わせへの対応に使用します。送信にはFormSubmitを利用します。</p>
<label class="consent"><input type="checkbox" required name="個人情報の取扱いへの同意" value="同意する"><span><a href="/privacy" target="_blank" rel="noopener">プライバシーポリシー</a>と<a href="https://formsubmit.co/privacy.pdf" target="_blank" rel="noopener">送信サービスの個人情報の取扱い</a>を確認し、送信に同意する</span></label>
<button type="submit">この内容で送信する <span aria-hidden="true">↗</span></button><p class="note">送信時に迷惑メール防止のための確認画面が表示される場合があります。</p>
<p class="alternative">メールでのご相談：<a href="mailto:hello@moment-tokyo.jp">hello@moment-tokyo.jp</a></p>
</form></div></main>
